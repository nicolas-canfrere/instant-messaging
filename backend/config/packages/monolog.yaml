monolog:
    # Un canal par contexte borne, plus le canal de deprecations du squelette.
    channels: ['identity', 'conversation', 'message', 'realtime', 'deprecation']

when@dev:
    monolog:
        handlers:
            # stderr plutot qu'un fichier : les logs sortent par `docker compose logs`,
            # au meme endroit que ceux des autres services.
            main:
                type: stream
                path: "php://stderr"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: stream
                path: "php://stderr"
                level: error

when@prod:
    monolog:
        handlers:
            # `fingers_crossed` garde les lignes debug en memoire et ne les ecrit
            # QUE si une erreur survient. C'est ce qui rend « logguer abondamment »
            # soutenable en production.
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                buffer_size: 200
                channels: ["!deprecation"]
            nested:
                type: stream
                path: "php://stderr"
                level: debug
                formatter: monolog.formatter.json
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json

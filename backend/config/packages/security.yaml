security:
    password_hashers:
        App\Shared\Infrastructure\Security\SecurityUser: 'auto'

    providers:
        app_users:
            id: App\Identity\Infrastructure\Security\SecurityUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api:
            pattern: ^/api
            provider: app_users
            # Session, pas jeton porteur : l'origine unique rend le cookie
            # utilisable tel quel, y compris pour le hub Mercure.
            stateless: false
            json_login:
                check_path: /api/login
                username_path: username
                password_path: password
                success_handler: App\Identity\Infrastructure\Security\LoginSuccessHandler
                failure_handler: App\Identity\Infrastructure\Security\LoginFailureHandler
            logout:
                path: /api/logout

    # Seule la premiere regle qui matche s'applique : le fourre-tout est en dernier.
    access_control:
        - { path: ^/api/ping$, roles: PUBLIC_ACCESS }
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/_test/, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Le hachage est couteux par conception. En test on abaisse le cout
            # au minimum : les fixtures hachent un mot de passe a chaque
            # lancement de la suite.
            App\Shared\Infrastructure\Security\SecurityUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

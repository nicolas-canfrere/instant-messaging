# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # `false` ici : `minio-create-bucket` (compose.yaml) cree deja le bucket au
    # demarrage. `services_test.yaml` la relève a `true`, seul environnement
    # sans cette aide. Un parametre plutot qu'une redefinition complete du
    # service : redefinir `S3MediaStorage` dans `services_test.yaml`
    # ecraserait ses AUTRES arguments (cf. le commentaire sur
    # DbalMediaRepository dans ce meme fichier).
    media.create_bucket_if_missing: false

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Le bus est choisi par le type du handler, pas par un attribut pose sur lui.
    # Un use case n'a ainsi aucune dependance vers le composant Messenger — ce
    # que deptrac verifie, Application n'ayant droit qu'a Domain et aux PSR.
    _instanceof:
        App\Shared\Application\Bus\CommandHandlerInterface:
            tags:
                - { name: messenger.message_handler, bus: command.bus }

        App\Shared\Application\Bus\QueryHandlerInterface:
            tags:
                - { name: messenger.message_handler, bus: query.bus }

        App\Shared\Application\Bus\DomainEventListenerInterface:
            tags:
                - { name: messenger.message_handler, bus: event.bus }

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            # `Domain/` ne contient que des entites, des value objects et des
            # ports. Rien n'y est un service : un agregat se construit par ses
            # constructeurs nommes, pas par le conteneur. Les laisser ici ferait
            # echouer la compilation sur leurs constructeurs non publics — et,
            # plus grave, laisserait croire qu'on peut les injecter.
            - '../src/*/Domain/'
            - '../src/Kernel.php'

    # ---------------------------------------------------------------------
    # Ports du domaine -> adaptateurs
    #
    # Exclure `Domain/` du resource ci-dessus supprime aussi l'alias implicite
    # que Symfony cree entre une interface et son unique implementation. On le
    # declare donc a la main. C'est de la ceremonie, mais elle donne la carte
    # des adaptateurs en un coup d'oeil, et un port sans adaptateur echoue a la
    # compilation du conteneur plutot qu'a l'execution.
    # ---------------------------------------------------------------------
    App\Shared\Domain\IdGeneratorInterface: '@App\Shared\Infrastructure\Id\UlidGenerator'
    App\Shared\Application\Event\DomainEventCollectorInterface: '@App\Shared\Infrastructure\Event\InMemoryDomainEventCollector'
    App\Identity\Domain\UserRepositoryInterface: '@App\Identity\Infrastructure\Persistence\DbalUserRepository'
    App\Realtime\Domain\EventPublisherInterface: '@App\Realtime\Infrastructure\Mercure\MercureEventPublisher'
    App\Realtime\Domain\PresenceStoreInterface: '@App\Realtime\Infrastructure\Presence\RedisPresenceStore'
    App\Conversation\Domain\ConversationRepositoryInterface: '@App\Conversation\Infrastructure\Persistence\DbalConversationRepository'
    App\Conversation\Domain\MembershipRepositoryInterface: '@App\Conversation\Infrastructure\Persistence\DbalMembershipRepository'
    App\Conversation\Application\Query\ConversationReaderInterface: '@App\Conversation\Infrastructure\Persistence\DbalConversationReader'
    App\Conversation\Application\MembershipCheckerInterface: '@App\Conversation\Infrastructure\Persistence\DbalMembershipChecker'
    App\Conversation\Application\LastMessagePointerWriterInterface: '@App\Conversation\Infrastructure\Persistence\DbalLastMessagePointerWriter'
    App\Message\Domain\MessageRepositoryInterface: '@App\Message\Infrastructure\Persistence\DbalMessageRepository'
    App\Message\Application\Query\MessageReaderInterface: '@App\Message\Infrastructure\Persistence\DbalMessageReader'
    App\Message\Application\Query\MessagePageReaderInterface: '@App\Message\Infrastructure\Persistence\DbalMessagePageReader'
    App\Message\Application\Query\MessagesCarryingMediaReaderInterface: '@App\Message\Infrastructure\Persistence\DbalMessagesCarryingMediaReader'
    App\Shared\Application\Bus\CommandDispatcherInterface: '@App\Shared\Infrastructure\Bus\CommandDispatcher'
    App\Shared\Application\Bus\DomainEventDispatcherInterface: '@App\Shared\Infrastructure\Bus\DomainEventDispatcher'
    App\Media\Domain\MediaRepositoryInterface: '@App\Media\Infrastructure\Persistence\DbalMediaRepository'
    App\Media\Application\Query\UploadTicketReaderInterface: '@App\Media\Infrastructure\Persistence\DbalUploadTicketReader'
    App\Media\Application\Query\OrphanMediaReaderInterface: '@App\Media\Infrastructure\Persistence\DbalOrphanMediaReader'
    App\Media\Application\MediaStorageInterface: '@App\Media\Infrastructure\Storage\S3MediaStorage'
    App\Media\Application\ImageInspectorInterface: '@App\Media\Infrastructure\Image\GdImageInspector'
    App\Media\Application\Contract\MediaOwnershipInterface: '@App\Media\Infrastructure\Contract\DbalMediaOwnership'
    App\Media\Application\Contract\MediaFinderInterface: '@App\Media\Infrastructure\Contract\DbalMediaFinder'
    App\Message\Domain\Port\MediaOwnershipPortInterface: '@App\Message\Infrastructure\Contract\MediaOwnershipAdapter'

    # Deux clients S3, deux endpoints. Le signeur ne sert QU'A signer : il ne
    # doit jamais emettre de requete, `localhost:8080` n'etant pas joignable
    # depuis le conteneur backend. Le jour d'un vrai S3, seul
    # `use_path_style_endpoint` disparait.
    media.s3.internal:
        class: Aws\S3\S3Client
        arguments:
            - version: 'latest'
              region: 'us-east-1'
              endpoint: '%env(MEDIA_S3_INTERNAL_ENDPOINT)%'
              use_path_style_endpoint: true
              credentials:
                  key: '%env(MEDIA_S3_KEY)%'
                  secret: '%env(MEDIA_S3_SECRET)%'

    media.s3.signer:
        class: Aws\S3\S3Client
        arguments:
            - version: 'latest'
              region: 'us-east-1'
              endpoint: '%env(MEDIA_S3_PUBLIC_ENDPOINT)%'
              use_path_style_endpoint: true
              credentials:
                  key: '%env(MEDIA_S3_KEY)%'
                  secret: '%env(MEDIA_S3_SECRET)%'

    App\Media\Infrastructure\Storage\S3MediaStorage:
        arguments:
            $internalClient: '@media.s3.internal'
            $signerClient: '@media.s3.signer'
            $bucket: '%env(MEDIA_BUCKET)%'
            $createBucketIfMissing: '%media.create_bucket_if_missing%'

    # Le meme convertisseur que celui du serialiseur, pour que les chemins de
    # violation sortent en snake_case comme le reste de l'API.
    App\Shared\Infrastructure\Http\ProblemDetailsListener:
        arguments:
            $nameConverter: '@serializer.name_converter.camel_case_to_snake_case'

    # Les identifiants de route arrivent typés dans les contrôleurs, et le voter
    # reçoit donc un ConversationId, pas une chaîne indistincte.
    App\Shared\Infrastructure\Http\UlidIdentifierValueResolver:
        tags:
            - { name: controller.argument_value_resolver, priority: 150 }

    # Contrats publies par Conversation, consommes par Realtime et Message.
    # Chaque couplage vise une surface publiee, jamais des internes (ADR 0001).
    App\Conversation\Application\Contract\MemberConversationsFinderInterface: '@App\Conversation\Infrastructure\Contract\DbalMemberConversationsFinder'
    App\Conversation\Application\Contract\ConversationMembershipInterface: '@App\Conversation\Infrastructure\Contract\DbalConversationMembership'
    App\Conversation\Application\Contract\ConversationPeersFinderInterface: '@App\Conversation\Infrastructure\Contract\DbalConversationPeersFinder'

    # Contrat publie par Message, consomme par Conversation pour le compteur de
    # non-lus : le couplage est reciproque, mais chaque sens vise une surface
    # publiee et aucune couche `*Contract` ne depend d'un contexte.
    App\Message\Application\Contract\UnreadCounterInterface: '@App\Message\Infrastructure\Contract\DbalUnreadCounter'

    # L'URL que le NAVIGATEUR ouvre, donc celle qui passe par l'origine unique —
    # pas l'URL interne par laquelle le backend publie.
    App\Realtime\Infrastructure\Http\RealtimeTokenController:
        arguments:
            $mercurePublicUrl: '%env(MERCURE_PUBLIC_URL)%'

    # CQS : deux bus distincts, nommes a l'injection, pour qu'un handler ne
    # puisse pas se tromper de bus par inadvertance.
    #
    # Alias a argument nomme plutot que `bind` sous `_defaults` : un `bind` que
    # personne ne consomme encore fait echouer la compilation, un alias inutilise
    # est simplement ignore.
    Symfony\Component\Messenger\MessageBusInterface $commandBus: '@command.bus'
    Symfony\Component\Messenger\MessageBusInterface $queryBus: '@query.bus'
    Symfony\Component\Messenger\MessageBusInterface $eventBus: '@event.bus'

    # `\Redis` est une classe d'extension, sans service par defaut : on la
    # construit ici. `connect()` est paresseux du point de vue de Symfony — le
    # service n'est instancie que si quelqu'un l'injecte.
    # `class` explicite : un id sans backslash n'est pas reconnu comme un FQCN,
    # Symfony n'en deduit donc aucune classe.
    Redis:
        class: Redis
        calls:
            - connect: ['%env(string:REDIS_HOST)%', '%env(int:REDIS_PORT)%']

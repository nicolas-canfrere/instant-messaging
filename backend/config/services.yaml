# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Le bus est choisi par le type du handler, pas par un attribut pose sur lui.
    # Un use case n'a ainsi aucune dependance vers le composant Messenger — ce
    # que deptrac verifie, Application n'ayant droit qu'a Domain et aux PSR.
    _instanceof:
        App\Shared\Application\Bus\CommandHandlerInterface:
            tags:
                - { name: messenger.message_handler, bus: command.bus }

        App\Shared\Application\Bus\QueryHandlerInterface:
            tags:
                - { name: messenger.message_handler, bus: query.bus }

        App\Shared\Application\Bus\DomainEventListenerInterface:
            tags:
                - { name: messenger.message_handler, bus: event.bus }

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            # `Domain/` ne contient que des entites, des value objects et des
            # ports. Rien n'y est un service : un agregat se construit par ses
            # constructeurs nommes, pas par le conteneur. Les laisser ici ferait
            # echouer la compilation sur leurs constructeurs non publics — et,
            # plus grave, laisserait croire qu'on peut les injecter.
            - '../src/*/Domain/'
            - '../src/Kernel.php'

    # ---------------------------------------------------------------------
    # Ports du domaine -> adaptateurs
    #
    # Exclure `Domain/` du resource ci-dessus supprime aussi l'alias implicite
    # que Symfony cree entre une interface et son unique implementation. On le
    # declare donc a la main. C'est de la ceremonie, mais elle donne la carte
    # des adaptateurs en un coup d'oeil, et un port sans adaptateur echoue a la
    # compilation du conteneur plutot qu'a l'execution.
    # ---------------------------------------------------------------------
    App\Shared\Domain\IdGeneratorInterface: '@App\Shared\Infrastructure\Id\UlidGenerator'
    App\Shared\Application\Event\DomainEventCollectorInterface: '@App\Shared\Infrastructure\Event\InMemoryDomainEventCollector'
    App\Identity\Domain\UserRepositoryInterface: '@App\Identity\Infrastructure\Persistence\DbalUserRepository'
    App\Realtime\Domain\EventPublisherInterface: '@App\Realtime\Infrastructure\Mercure\MercureEventPublisher'
    App\Conversation\Domain\ConversationRepositoryInterface: '@App\Conversation\Infrastructure\Persistence\DbalConversationRepository'
    App\Conversation\Application\Query\ConversationReaderInterface: '@App\Conversation\Infrastructure\Persistence\DbalConversationReader'
    App\Conversation\Application\MembershipCheckerInterface: '@App\Conversation\Infrastructure\Persistence\DbalMembershipChecker'

    # Les identifiants de route arrivent typés dans les contrôleurs, et le voter
    # reçoit donc un ConversationId, pas une chaîne indistincte.
    App\Shared\Infrastructure\Http\UlidIdentifierValueResolver:
        tags:
            - { name: controller.argument_value_resolver, priority: 150 }

    # Contrat publie par Conversation, consomme par Realtime : le seul couplage
    # inter-contextes du projet, et il vise une surface publiee (cf. ADR 0001).
    App\Conversation\Application\Contract\MemberConversationsFinderInterface: '@App\Conversation\Infrastructure\Contract\DbalMemberConversationsFinder'

    # L'URL que le NAVIGATEUR ouvre, donc celle qui passe par l'origine unique —
    # pas l'URL interne par laquelle le backend publie.
    App\Realtime\Infrastructure\Http\RealtimeTokenController:
        arguments:
            $mercurePublicUrl: '%env(MERCURE_PUBLIC_URL)%'

    # CQS : deux bus distincts, nommes a l'injection, pour qu'un handler ne
    # puisse pas se tromper de bus par inadvertance.
    #
    # Alias a argument nomme plutot que `bind` sous `_defaults` : un `bind` que
    # personne ne consomme encore fait echouer la compilation, un alias inutilise
    # est simplement ignore.
    Symfony\Component\Messenger\MessageBusInterface $commandBus: '@command.bus'
    Symfony\Component\Messenger\MessageBusInterface $queryBus: '@query.bus'
    Symfony\Component\Messenger\MessageBusInterface $eventBus: '@event.bus'

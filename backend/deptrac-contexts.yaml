# Dimension contexte : un contexte ne depend que du contrat publie d'un autre,
# jamais de ses internes (cf. ADR 0001).
deptrac:
    paths:
        - ./src
    layers:
        - name: Shared
          collectors: [{ type: directory, value: 'src/Shared/.*' }]

        # La surface publiee de Conversation est une couche distincte du contexte
        # lui-meme : c'est la seule chose que les autres ont le droit de voir.
        - name: ConversationContract
          collectors: [{ type: directory, value: 'src/Conversation/Application/Contract/.*' }]

        - name: Conversation
          collectors:
              - type: bool
                must:
                    - { type: directory, value: 'src/Conversation/.*' }
                must_not:
                    - { type: directory, value: 'src/Conversation/Application/Contract/.*' }

        - name: Identity
          collectors: [{ type: directory, value: 'src/Identity/.*' }]
        - name: Message
          collectors: [{ type: directory, value: 'src/Message/.*' }]
        - name: Realtime
          collectors: [{ type: directory, value: 'src/Realtime/.*' }]

        # Presente uniquement pour que `--fail-on-uncovered` ait un sens ici :
        # sans elle, chaque `use Symfony\...` remonterait comme non couvert.
        # Quelle couche a le droit de toucher au vendor est une question de
        # dimension technique, tranchee par `deptrac.yaml`.
        - name: Vendor
          collectors:
              - type: classNameRegex
                value: '#^(Symfony|Doctrine|Psr|Monolog|Lcobucci)\\.*#'

    ruleset:
        Shared: [Vendor]

        # Un contrat publie ne depend d'aucun CONTEXTE, mais il parle le langage
        # partage : sa signature ne peut etre faite que d'identifiants de Shared
        # et de scalaires (ADR 0001). Sans Shared ici, aucun contrat ne pourrait
        # nommer ce qu'il rend.
        ConversationContract: [Shared]

        Identity: [Shared, Vendor]
        # Conversation depend de son PROPRE contrat : le producteur possede sa
        # surface publiee, donc il l'implemente.
        Conversation: [Shared, ConversationContract, Vendor]
        # Message demande a Conversation si l'expediteur a acces au fil. Cette
        # ligne est la friction voulue : elargir l'allowlist doit etre un geste
        # delibere, et ce couplage vise une surface publiee, pas des internes.
        Message: [Shared, ConversationContract, Vendor]

        # Allowlist explicite : ajouter un couplage inter-contextes demande de
        # modifier cette ligne. La friction est voulue.
        Realtime: [Shared, ConversationContract, Vendor]

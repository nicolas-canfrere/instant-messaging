services:
  # Origine unique : tout passe par http://localhost:8080. C'est le seul port
  # publié — backend, hub et Vite ne sont joignables qu'entre conteneurs.
  # Même origine ⇒ le cookie `mercureAuthorization` posé par le backend est
  # renvoyé au hub sans CORS ni SameSite=None.
  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      mercure:
        condition: service_started

  backend:
    build:
      context: ./backend
      args:
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://app:app@postgres:5432/app?serverVersion=17&charset=utf8"
      # Nom attendu par symfony/mercure-bundle (config/packages/mercure.yaml) :
      # `url` = où le backend publie, en interne.
      MERCURE_URL: "http://mercure/.well-known/mercure"
      # `public_url` = ce que le navigateur ouvre, donc via l'origine unique.
      MERCURE_PUBLIC_URL: "http://localhost:8080/.well-known/mercure"
      MERCURE_JWT_SECRET: "${MERCURE_JWT_SECRET}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      MESSENGER_TRANSPORT_DSN: "${MESSENGER_TRANSPORT_DSN}"
      MEDIA_BUCKET: "${MEDIA_BUCKET}"
      MEDIA_S3_INTERNAL_ENDPOINT: "${MEDIA_S3_INTERNAL_ENDPOINT}"
      MEDIA_S3_PUBLIC_ENDPOINT: "${MEDIA_S3_PUBLIC_ENDPOINT}"
      MEDIA_S3_KEY: "${MEDIA_S3_KEY}"
      MEDIA_S3_SECRET: "${MEDIA_S3_SECRET}"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      # Volume ANONYME, donc propre à chaque conteneur : il masque le
      # `node_modules` du bind mount pour garder celui construit dans l'image
      # (dépendances natives compilées pour Alpine, pas pour l'hôte).
      # Conséquence à connaître : `docker compose run --rm frontend npm …` reçoit
      # un volume neuf et jetable. Les cibles `front-*` du Makefile passent donc
      # par `exec` sur le conteneur qui tourne.
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  mercure:
    image: dunglas/mercure
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "${MERCURE_JWT_SECRET}"
      MERCURE_SUBSCRIBER_JWT_KEY: "${MERCURE_JWT_SECRET}"
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:8080
    volumes:
      - mercure_data:/data

  # Presence uniquement : etat ephemere a TTL. AUCUN volume, deliberement — un
  # etat de presence qui survivrait au redemarrage affirmerait que des gens sont
  # en ligne alors que plus personne ne le sait. Redis repart vide, et le premier
  # heartbeat de chacun reconstruit tout en moins de 20 s.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Stockage objet compatible S3. La console web (`:9001`) permet de VOIR les
  # objets arriver pendant qu'on teste — c'est la moitié de l'intérêt de MinIO
  # en local. Le port 9000 n'est PAS publié : le navigateur passe par Caddy,
  # qui est l'origine unique du projet (spec §5.2).
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MEDIA_S3_KEY}"
      MINIO_ROOT_PASSWORD: "${MEDIA_S3_SECRET}"
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot : cree le bucket au demarrage puis sort. `anonymous set none` est
  # explicite plutot qu'implicite — un bucket media ne doit JAMAIS etre lisible
  # sans signature, et le dire ici vaut mieux que de supposer le defaut.
  minio-create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MEDIA_S3_KEY} ${MEDIA_S3_SECRET} &&
      mc mb --ignore-existing local/${MEDIA_BUCKET} &&
      mc anonymous set none local/${MEDIA_BUCKET}
      "

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Meme image que `backend`, autre commande. `--time-limit` fait sortir le
  # process toutes les heures : `restart: unless-stopped` le relance, ce qui
  # borne les fuites memoire d'un process PHP longue duree sans supervision.
  worker:
    build:
      context: ./backend
      args:
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://app:app@postgres:5432/app?serverVersion=17&charset=utf8"
      MERCURE_URL: "http://mercure/.well-known/mercure"
      MERCURE_PUBLIC_URL: "http://localhost:8080/.well-known/mercure"
      MERCURE_JWT_SECRET: "${MERCURE_JWT_SECRET}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      MESSENGER_TRANSPORT_DSN: "${MESSENGER_TRANSPORT_DSN}"
      MEDIA_BUCKET: "${MEDIA_BUCKET}"
      MEDIA_S3_INTERNAL_ENDPOINT: "${MEDIA_S3_INTERNAL_ENDPOINT}"
      MEDIA_S3_PUBLIC_ENDPOINT: "${MEDIA_S3_PUBLIC_ENDPOINT}"
      MEDIA_S3_KEY: "${MEDIA_S3_KEY}"
      MEDIA_S3_SECRET: "${MEDIA_S3_SECRET}"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    entrypoint: []
    command: ["php", "bin/console", "messenger:consume", "media", "--time-limit=3600", "-v"]
    restart: unless-stopped
    # L'image herite du HEALTHCHECK de FrankenPHP (curl vers l'API d'admin
    # Caddy, port 2019) : ce conteneur ne lance jamais Caddy, seulement la
    # commande ci-dessus. Sans ce `disable`, `--wait` finirait par le voir
    # "unhealthy" alors que le worker consomme normalement.
    healthcheck:
      disable: true

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  mercure_data:
  minio_data:
  rabbitmq_data:

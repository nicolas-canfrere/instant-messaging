services:
  # Origine unique : tout passe par http://localhost:8080. C'est le seul port
  # publié — backend, hub et Vite ne sont joignables qu'entre conteneurs.
  # Même origine ⇒ le cookie `mercureAuthorization` posé par le backend est
  # renvoyé au hub sans CORS ni SameSite=None.
  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      mercure:
        condition: service_started

  backend:
    build:
      context: ./backend
      args:
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://app:app@postgres:5432/app?serverVersion=17&charset=utf8"
      # Nom attendu par symfony/mercure-bundle (config/packages/mercure.yaml) :
      # `url` = où le backend publie, en interne.
      MERCURE_URL: "http://mercure/.well-known/mercure"
      # `public_url` = ce que le navigateur ouvre, donc via l'origine unique.
      MERCURE_PUBLIC_URL: "http://localhost:8080/.well-known/mercure"
      MERCURE_JWT_SECRET: "${MERCURE_JWT_SECRET}"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  # Le Dockerfile de ce service arrive avec la tâche 13. Jusque-là, lever
  # explicitement les autres : docker compose up -d caddy backend mercure postgres
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  mercure:
    image: dunglas/mercure
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "${MERCURE_JWT_SECRET}"
      MERCURE_SUBSCRIBER_JWT_KEY: "${MERCURE_JWT_SECRET}"
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:8080
    volumes:
      - mercure_data:/data

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  mercure_data:
